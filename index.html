<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nöbet Tercih Sistemi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #FBF8F3;
  --paper: #F4EFE6;
  --ink: #1A1612;
  --ink-soft: #5C534A;
  --ink-muted: #8B8278;
  --teal: #1F4F4A;
  --teal-dark: #163936;
  --coral: #C7484B;
  --coral-light: #F0DADB;
  --amber: #C7763B;
  --green: #4A6B3F;
  --line: #D9D2C5;
  --line-light: #ECE6D8;
  --shadow: 0 1px 3px rgba(26, 22, 18, 0.04), 0 4px 16px rgba(26, 22, 18, 0.04);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--cream); color: var(--ink); }
body {
  font-family: 'IBM Plex Sans', -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  padding: 24px 16px;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--ink);
}
h1 { font-size: 30px; line-height: 1.1; font-variation-settings: "opsz" 72; }
h2 { font-size: 21px; line-height: 1.2; margin-bottom: 14px; }
h3 { font-size: 16px; line-height: 1.3; font-weight: 600; font-family: 'IBM Plex Sans', sans-serif; letter-spacing: 0; }
p { color: var(--ink-soft); }
.container {
  max-width: 720px;
  margin: 0 auto;
  background: white;
  border-radius: 14px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line-light);
  padding: 32px 28px;
}
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 20px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--line-light);
  gap: 16px;
  flex-wrap: wrap;
}
.header-bar .subtitle {
  font-size: 13px;
  color: var(--ink-muted);
  margin-top: 4px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.user-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--paper);
  border-radius: 999px;
  font-size: 13px;
  color: var(--ink-soft);
}
.user-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

/* Forms */
.form-group { margin-bottom: 16px; }
label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
  margin-bottom: 6px;
  letter-spacing: 0.01em;
}
input[type="text"], input[type="password"], input[type="date"], input[type="number"], select {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
  background: white;
  color: var(--ink);
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, select:focus {
  outline: none;
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(31, 79, 74, 0.1);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--teal);
  color: white;
  border: none;
  padding: 11px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  transition: background 0.15s, transform 0.05s;
}
.btn:hover { background: var(--teal-dark); }
.btn:active { transform: translateY(1px); }
.btn-secondary { background: white; color: var(--ink); border: 1px solid var(--line); }
.btn-secondary:hover { background: var(--paper); }
.btn-danger { background: var(--coral); }
.btn-danger:hover { background: #a73a3d; }
.btn-ghost { background: transparent; color: var(--ink-soft); padding: 8px 12px; }
.btn-ghost:hover { background: var(--paper); }
.btn-sm { padding: 7px 12px; font-size: 13px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Alerts */
.alert {
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  border-left: 3px solid;
}
.alert-info { background: var(--paper); border-color: var(--teal); color: var(--ink-soft); }
.alert-warning { background: #FBF1E3; border-color: var(--amber); color: #6B4517; }
.alert-success { background: #EDF1E8; border-color: var(--green); color: #2F4226; }
.alert-danger { background: var(--coral-light); border-color: var(--coral); color: #6B2024; }

/* Calendar */
.calendar-wrap {
  background: var(--paper);
  border-radius: 12px;
  padding: 20px 16px;
  margin: 18px 0;
}
.calendar-info {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 14px;
  padding: 0 4px;
}
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.day-cell {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
  border: 1px solid var(--line-light);
  border-radius: 8px;
  cursor: pointer;
  font-weight: 500;
  font-size: 15px;
  color: var(--ink);
  user-select: none;
  transition: all 0.12s;
  font-variant-numeric: tabular-nums;
}
.day-cell:hover { border-color: var(--teal); transform: translateY(-1px); }
.day-cell.selected {
  background: var(--coral);
  color: white;
  border-color: var(--coral);
  box-shadow: 0 2px 6px rgba(199, 72, 75, 0.25);
}
.day-cell.empty {
  background: transparent;
  border: 1px dashed var(--line);
  cursor: default;
}
.day-cell.empty:hover { transform: none; border-color: var(--line); }
.day-cell.locked {
  cursor: not-allowed;
  opacity: 0.7;
}
.day-cell.locked:hover { transform: none; border-color: var(--line-light); }
.day-cell.locked.selected:hover { border-color: var(--coral); }

/* Range input */
.range-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-wrap: wrap;
  margin-top: 14px;
  padding: 14px;
  background: white;
  border-radius: 8px;
  border: 1px solid var(--line-light);
}
.range-row .range-inputs { display: flex; gap: 8px; align-items: flex-end; flex: 1; min-width: 200px; }
.range-row label { margin-bottom: 4px; font-size: 12px; }
.range-row input[type="number"] { width: 70px; padding: 8px 10px; }

/* Tabs */
.tab-bar {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--line-light);
  margin-bottom: 24px;
  overflow-x: auto;
}
.tab {
  padding: 10px 16px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  color: var(--ink-soft);
  font-weight: 500;
  font-size: 14px;
  white-space: nowrap;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
  font-family: inherit;
}
.tab.active { border-bottom-color: var(--teal); color: var(--ink); }
.tab:hover { color: var(--ink); }

/* Resident table */
.resident-list {
  background: white;
  border: 1px solid var(--line-light);
  border-radius: 10px;
  overflow: hidden;
}
.resident-row {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  gap: 14px;
  border-bottom: 1px solid var(--line-light);
}
.resident-row:last-child { border-bottom: none; }
.resident-row .name { font-weight: 600; min-width: 70px; font-variant-caps: small-caps; letter-spacing: 0.05em; }
.resident-row .meta { color: var(--ink-muted); font-size: 13px; flex: 1; }
.resident-row .actions { display: flex; gap: 6px; }
.checkbox-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink-soft);
}
.checkbox-wrap input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--green); }

/* Slot list (admin editable) */
.slot-list-header {
  display: grid;
  grid-template-columns: 28px 1fr 110px 90px 36px;
  gap: 10px;
  padding: 8px 14px;
  font-size: 12px;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}
.slot-list {
  background: white;
  border: 1px solid var(--line-light);
  border-radius: 10px;
  overflow: hidden;
}
.slot-row {
  display: grid;
  grid-template-columns: 28px 1fr 110px 90px 36px;
  gap: 10px;
  align-items: center;
  padding: 8px 14px;
  border-bottom: 1px solid var(--line-light);
}
.slot-row:last-child { border-bottom: none; }
.slot-row:hover { background: #FCFAF5; }
.slot-num {
  font-size: 12px;
  color: var(--ink-muted);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.slot-name, .slot-pass {
  padding: 7px 10px;
  font-size: 14px;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 6px;
  font-family: inherit;
  color: var(--ink);
}
.slot-name:hover, .slot-pass:hover { border-color: var(--line); background: white; }
.slot-name:focus, .slot-pass:focus {
  outline: none;
  border-color: var(--teal);
  background: white;
  box-shadow: 0 0 0 2px rgba(31, 79, 74, 0.1);
}
.slot-name { font-weight: 600; }
.slot-pass { font-family: monospace; }
.slot-meta { font-size: 12px; color: var(--ink-muted); }
.clear-slot-btn {
  padding: 4px 8px !important;
  font-size: 14px !important;
  color: var(--ink-muted);
}
.clear-slot-btn:hover { color: var(--coral); background: var(--coral-light); }

@media (max-width: 520px) {
  .slot-list-header { display: none; }
  .slot-row { grid-template-columns: 24px 1fr 90px 30px; }
  .slot-row .slot-meta { display: none; }
}

/* Summary box */
.summary-box {
  background: var(--paper);
  border: 1px solid var(--line-light);
  border-radius: 10px;
  padding: 20px;
  font-family: 'IBM Plex Sans', monospace;
  font-size: 14px;
  white-space: pre-wrap;
  line-height: 1.9;
  margin-top: 12px;
  font-variant-numeric: tabular-nums;
}
.summary-box .name-tok { font-weight: 600; color: var(--teal-dark); }
.summary-box .empty-tok { color: var(--ink-muted); font-style: italic; }

/* Utility */
.muted { color: var(--ink-muted); font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.mt-3 { margin-top: 20px; }
.mt-4 { margin-top: 28px; }
.mb-2 { margin-bottom: 12px; }
.divider { height: 1px; background: var(--line-light); margin: 24px 0; }
.cred-hint {
  background: var(--paper);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 12px;
  color: var(--ink-muted);
  margin-top: 16px;
  font-family: monospace;
}
.cred-hint b { color: var(--ink-soft); }

/* Spinner */
.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid var(--line);
  border-top-color: var(--teal);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.sync-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: #EDF1E8;
  border-radius: 999px;
  font-size: 11px;
  color: #4A6B3F;
  font-weight: 500;
  letter-spacing: 0.02em;
}
.sync-chip::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-muted); margin-top: 12px; }
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); }
.legend-swatch.sel { background: var(--coral); border-color: var(--coral); }

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(26, 22, 18, 0.4);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; z-index: 100;
}
.modal {
  background: white;
  border-radius: 12px;
  padding: 24px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 20px 50px rgba(0,0,0,0.2);
}

@media (max-width: 520px) {
  body { padding: 12px 8px; }
  .container { padding: 22px 18px; }
  h1 { font-size: 24px; }
  .day-cell { font-size: 14px; border-radius: 6px; }
  .calendar-grid { gap: 5px; }
  .resident-row { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div class="container" id="app"></div>

<script type="module">
/* ============================================================
   FIREBASE IMPORTS — CDN'den modüler v12 SDK
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

/* ============================================================
   👇 BURAYI FIREBASE CONSOLE'DAN ALDIĞINIZ CONFIG İLE DEĞİŞTİRİN
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyApdpvMPbmgRbqSGjZz4bz2iV6ekhN5Cl4",
  authDomain: "sahneurology.firebaseapp.com",
  projectId: "sahneurology",
  storageBucket: "sahneurology.firebasestorage.app",
  messagingSenderId: "269306154906",
  appId: "1:269306154906:web:528636a91bcae4ba25b423",
  measurementId: "G-E5DZF5BYNG"
};
/* ============================================================ */

const fbApp = initializeApp(firebaseConfig);
const fbAuth = getAuth(fbApp);
const fbDb = getFirestore(fbApp);
const DOC_REF = doc(fbDb, "nobet", "state");

/* ============================================================
   NÖBET TERCİH SİSTEMİ
   Firestore tabanlı — tüm cihazlar gerçek zamanlı senkron

   VARSAYILAN GİRİŞLER (admin panelinden değiştirin):
   - Yönetici: şifre "admin123"
   - Asistanlar: şifre "1234"
   ============================================================ */

const DEFAULT_NAMES = ['ESM','KK','EK','ED','MA','GH','GA','GD','SM','ŞT','AH','SY','PB','OC','BK','MÇ','SÇ','İK','GÇ','BCO','BGB'];
const EMPTY_SLOT_COUNT = 20;

function buildDefaultResidents() {
  const list = [];
  DEFAULT_NAMES.forEach((n, i) => {
    list.push({ id: 'r' + (i + 1), name: n, password: '1234', submitted: false, offDates: [] });
  });
  for (let i = 0; i < EMPTY_SLOT_COUNT; i++) {
    list.push({ id: 'r' + (DEFAULT_NAMES.length + i + 1), name: '', password: '1234', submitted: false, offDates: [] });
  }
  return list;
}

const DEFAULT_DATA = {
  config: {
    startDate: '',   // ISO 'YYYY-MM-DD' — yöneticinin belirlediği başlangıç
    cutoffDate: '',  // ISO 'YYYY-MM-DD' — son veri giriş tarihi
  },
  residents: buildDefaultResidents(),
  admin: { password: 'admin123' }
};

function loadData() {
  // Firestore'dan yükleme initFirebase() içinde yapılır.
  // Bu fonksiyon yalnızca default şablon döner.
  return structuredClone(DEFAULT_DATA);
}

async function saveData() {
  try {
    await setDoc(DOC_REF, state.data);
  } catch (e) {
    console.error('Firestore yazma hatası:', e);
    alert('Kayıt başarısız: ' + e.message + '\n\nİnternet bağlantınızı veya Firebase config\'inizi kontrol edin.');
  }
}

const state = {
  view: 'login',       // 'login' | 'resident' | 'admin'
  currentUser: null,   // resident object or 'admin'
  adminTab: 'window',  // 'window' | 'submissions' | 'summary' | 'residents'
  data: structuredClone(DEFAULT_DATA),
  loginError: '',
  flash: '',
  fbStatus: 'loading',  // 'loading' | 'ready' | 'error'
  fbError: '',
};

/* ---------- Utility ---------- */
function todayISO() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}
function addDaysISO(iso, days) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function fmtTR(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
}
function isWindowOpen() {
  const { startDate, cutoffDate } = state.data.config;
  if (!startDate || !cutoffDate) return false;
  const t = todayISO();
  return t >= startDate && t <= cutoffDate;
}
function daysUntilCutoff() {
  const { cutoffDate } = state.data.config;
  if (!cutoffDate) return null;
  const t = new Date(todayISO() + 'T00:00:00');
  const c = new Date(cutoffDate + 'T00:00:00');
  return Math.round((c - t) / (1000 * 60 * 60 * 24));
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function newId() { return 'r' + Math.random().toString(36).slice(2, 8); }

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  const app = document.getElementById('app');
  if (state.fbStatus === 'loading') { app.innerHTML = renderLoading(); return; }
  if (state.fbStatus === 'error')   { app.innerHTML = renderError(); return; }
  if (state.view === 'login') app.innerHTML = renderLogin();
  else if (state.view === 'resident') app.innerHTML = renderResident();
  else if (state.view === 'admin') app.innerHTML = renderAdmin();
  bindEvents();
  state.flash = '';
}

function renderLoading() {
  return `
    <div class="header-bar">
      <div>
        <h1>Nöbet Tercih Sistemi</h1>
        <div class="subtitle">Bağlanıyor...</div>
      </div>
    </div>
    <div class="alert alert-info">
      <span class="spinner"></span> Firebase'e bağlanılıyor, lütfen bekleyin...
    </div>
  `;
}

function renderError() {
  return `
    <div class="header-bar">
      <div>
        <h1>Bağlantı Hatası</h1>
        <div class="subtitle">Firebase'e ulaşılamadı</div>
      </div>
    </div>
    <div class="alert alert-danger">
      <b>Hata:</b> ${escapeHtml(state.fbError)}
    </div>
    <p class="muted mb-2">Olası nedenler:</p>
    <ul style="padding-left: 22px; color: var(--ink-soft); line-height: 1.8;">
      <li>HTML içindeki <code>firebaseConfig</code> yanlış veya eksik doldurulmuş</li>
      <li>Firestore Database henüz oluşturulmamış</li>
      <li>Anonymous Authentication aktifleştirilmemiş</li>
      <li>Security Rules giriş yapanlara izin vermiyor</li>
      <li>İnternet bağlantısı yok</li>
    </ul>
    <button class="btn mt-3" onclick="location.reload()">Tekrar dene</button>
  `;
}

/* ---------- LOGIN ---------- */
function renderLogin() {
  const named = state.data.residents.filter(r => r.name && r.name.trim());
  const options = named.map(r =>
    `<option value="${r.id}">${escapeHtml(r.name)}</option>`
  ).join('');
  return `
    <div class="header-bar">
      <div>
        <h1>Nöbet Tercih Sistemi</h1>
        <div class="subtitle">Nöroloji asistanları</div>
      </div>
      <span class="sync-chip">Senkron · Çevrimiçi</span>
    </div>

    <p class="mb-2">Nöbet istemediğiniz günleri seçmek için giriş yapın.</p>

    ${state.loginError ? `<div class="alert alert-danger">${escapeHtml(state.loginError)}</div>` : ''}

    <div class="form-group">
      <label for="loginUser">Kullanıcı</label>
      <select id="loginUser">
        <option value="">— Seçin —</option>
        <optgroup label="Asistanlar">${options}</optgroup>
        <optgroup label="Yönetici">
          <option value="__admin__">Site Yöneticisi</option>
        </optgroup>
      </select>
    </div>

    <div class="form-group">
      <label for="loginPass">Şifre</label>
      <input type="password" id="loginPass" autocomplete="current-password" placeholder="••••">
    </div>

    <button class="btn" id="loginBtn">Giriş Yap</button>

    <div class="cred-hint">
      <b>Test girişleri:</b><br>
      Asistanlar — şifre: <code>1234</code><br>
      Yönetici — şifre: <code>admin123</code>
    </div>
  `;
}

/* ---------- RESIDENT VIEW ---------- */
function renderResident() {
  const r = state.currentUser;
  const open = isWindowOpen();
  const days = daysUntilCutoff();
  const locked = r.submitted || !open;

  let statusAlert = '';
  if (!state.data.config.startDate || !state.data.config.cutoffDate) {
    statusAlert = `<div class="alert alert-warning">Yönetici henüz veri giriş dönemini açmadı.</div>`;
  } else if (!open) {
    const t = todayISO();
    if (t < state.data.config.startDate) {
      statusAlert = `<div class="alert alert-info">Veri girişi <b>${fmtTR(state.data.config.startDate)}</b> tarihinde açılacak.</div>`;
    } else {
      statusAlert = `<div class="alert alert-danger">Son tarih (${fmtTR(state.data.config.cutoffDate)}) geçti. Değişiklik için yöneticinize başvurun.</div>`;
    }
  } else if (r.submitted) {
    statusAlert = `<div class="alert alert-success">Tercihleriniz <b>kaydedildi</b>. Değiştirmek için yöneticinizin onay kutusunu kaldırmasını isteyin.</div>`;
  } else {
    statusAlert = `<div class="alert alert-info">Son tarih: <b>${fmtTR(state.data.config.cutoffDate)}</b> ${days !== null ? `· <b>${days}</b> gün kaldı` : ''}</div>`;
  }

  return `
    <div class="header-bar">
      <div>
        <h1>Nöbet İstenmeyen Günler</h1>
        <div class="subtitle">Asistan paneli</div>
      </div>
      <div class="row">
        <span class="user-chip"><span class="dot"></span>${escapeHtml(r.name)}</span>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Çıkış</button>
      </div>
    </div>

    ${statusAlert}

    <h2>Takvim · 31 günlük ay</h2>
    <p class="muted">Nöbet istemediğiniz günleri tıklayarak seçin. Tıklayınca işaretlenir, tekrar tıklayınca kaldırılır.</p>

    <div class="calendar-wrap">
      <div class="calendar-info">
        <span>Seçili gün sayısı: <b>${r.offDates.length}</b></span>
        ${locked ? '<span style="color: var(--coral);">🔒 Kilitli</span>' : '<span style="color: var(--green);">● Düzenleniyor</span>'}
      </div>
      <div class="calendar-grid" id="calendar">
        ${renderCalendarCells(r.offDates, locked)}
      </div>
      <div class="legend">
        <div class="legend-item"><span class="legend-swatch"></span>Boş</div>
        <div class="legend-item"><span class="legend-swatch sel"></span>İstenmiyor</div>
      </div>
    </div>

    ${locked ? '' : `
      <div class="range-row">
        <div class="range-inputs">
          <div>
            <label>Aralık başı</label>
            <input type="number" id="rangeFrom" min="1" max="31" placeholder="örn. 13">
          </div>
          <div>
            <label>Aralık sonu</label>
            <input type="number" id="rangeTo" min="1" max="31" placeholder="örn. 18">
          </div>
          <button class="btn btn-sm" id="rangeAddBtn">Aralık ekle</button>
        </div>
        <button class="btn btn-secondary btn-sm" id="clearOwnBtn">Tümünü temizle</button>
      </div>

      <div class="mt-4 row-between">
        <p class="muted">Kaydettiğinizde değişiklik yapamazsınız.</p>
        <button class="btn" id="submitBtn">Kaydet ve Gönder</button>
      </div>
    `}
  `;
}

function renderCalendarCells(selected, locked) {
  const cells = [];
  for (let i = 1; i <= 31; i++) {
    const sel = selected.includes(i);
    const cls = ['day-cell'];
    if (sel) cls.push('selected');
    if (locked) cls.push('locked');
    cells.push(`<div class="${cls.join(' ')}" data-day="${i}">${i}</div>`);
  }
  // 4 boş hücre (7x5 grid için)
  for (let i = 0; i < 4; i++) cells.push('<div class="day-cell empty"></div>');
  return cells.join('');
}

/* ---------- ADMIN VIEW ---------- */
function renderAdmin() {
  return `
    <div class="header-bar">
      <div>
        <h1>Yönetici Paneli</h1>
        <div class="subtitle">Nöbet tercih sistemi</div>
      </div>
      <div class="row">
        <span class="user-chip"><span class="dot"></span>Yönetici</span>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Çıkış</button>
      </div>
    </div>

    ${state.flash ? `<div class="alert alert-success">${escapeHtml(state.flash)}</div>` : ''}

    <div class="tab-bar">
      <button class="tab ${state.adminTab === 'window' ? 'active' : ''}" data-tab="window">Veri giriş penceresi</button>
      <button class="tab ${state.adminTab === 'submissions' ? 'active' : ''}" data-tab="submissions">Asistanlar</button>
      <button class="tab ${state.adminTab === 'summary' ? 'active' : ''}" data-tab="summary">Toplu özet</button>
      <button class="tab ${state.adminTab === 'residents' ? 'active' : ''}" data-tab="residents">Asistan listesi</button>
    </div>

    ${state.adminTab === 'window' ? renderAdminWindow() : ''}
    ${state.adminTab === 'submissions' ? renderAdminSubmissions() : ''}
    ${state.adminTab === 'summary' ? renderAdminSummary() : ''}
    ${state.adminTab === 'residents' ? renderAdminResidents() : ''}
  `;
}

function renderAdminWindow() {
  const { startDate, cutoffDate } = state.data.config;
  const open = isWindowOpen();
  const days = daysUntilCutoff();
  const today = todayISO();

  return `
    <h2>Veri giriş dönemini ayarla</h2>
    <p class="muted mb-2">Başlangıç tarihinden cutoff tarihine kadar asistanlar tercih girebilir. Cutoff sonrası kilitlenir.</p>

    <div class="row">
      <div class="form-group" style="flex:1; min-width: 180px;">
        <label for="startDateInput">Başlangıç tarihi</label>
        <input type="date" id="startDateInput" value="${startDate || today}">
      </div>
      <div class="form-group" style="flex:1; min-width: 180px;">
        <label for="cutoffDateInput">Cutoff (son) tarihi</label>
        <input type="date" id="cutoffDateInput" value="${cutoffDate || addDaysISO(today, 5)}">
      </div>
    </div>

    <div class="row mb-2">
      <button class="btn" id="saveWindowBtn">Kaydet</button>
      <button class="btn btn-secondary btn-sm" id="quick5Btn">Bugün + 5 gün</button>
      <button class="btn btn-secondary btn-sm" id="quick7Btn">Bugün + 7 gün</button>
    </div>

    <div class="divider"></div>

    <h3>Mevcut durum</h3>
    <div class="alert ${open ? 'alert-success' : 'alert-warning'}">
      ${startDate && cutoffDate
        ? `<b>${open ? 'Veri girişi AÇIK' : 'Veri girişi KAPALI'}</b> · Başlangıç: ${fmtTR(startDate)} → Cutoff: ${fmtTR(cutoffDate)}${days !== null && open ? ` · ${days} gün kaldı` : ''}`
        : 'Tarihler ayarlanmamış. Yukarıdan belirleyin.'}
    </div>

    <div class="divider"></div>

    <h3>Yeni ay için sıfırla</h3>
    <p class="muted mb-2">Tüm asistanların tarihlerini ve gönderim durumlarını sıfırlar. Asistan listesi ve şifreler korunur.</p>
    <button class="btn btn-danger" id="clearBtn">🗑 Tüm verileri temizle (yeni ay)</button>
  `;
}

function renderAdminSubmissions() {
  const residents = state.data.residents.filter(r => r.name && r.name.trim());
  const rows = residents.map(r => `
    <div class="resident-row">
      <span class="name">${escapeHtml(r.name)}</span>
      <span class="meta">${r.offDates.length > 0
        ? `<b>${r.offDates.length}</b> gün: ${r.offDates.slice().sort((a,b)=>a-b).join(', ')}`
        : '<span style="color: var(--ink-muted)">— henüz veri girilmedi —</span>'}</span>
      <label class="checkbox-wrap" title="Onayı kaldırırsanız asistan tekrar düzenleyebilir">
        <input type="checkbox" data-resid="${r.id}" ${r.submitted ? 'checked' : ''} class="submit-toggle">
        ${r.submitted ? 'Onaylandı' : 'Bekleniyor'}
      </label>
    </div>
  `).join('');

  return `
    <h2>Asistan gönderimleri</h2>
    <p class="muted mb-2">Onay kutusunu kaldırırsanız ilgili asistan tercihlerini tekrar düzenleyebilir.</p>
    <div class="resident-list">${rows || '<div class="resident-row">Henüz asistan eklenmemiş.</div>'}</div>
  `;
}

function renderAdminSummary() {
  const residents = state.data.residents.filter(r => r.name && r.name.trim());
  const lines = residents.map(r => {
    if (r.offDates.length === 0) {
      return `<span class="name-tok">${escapeHtml(r.name)}</span>: <span class="empty-tok">— yok —</span>`;
    }
    const sorted = r.offDates.slice().sort((a, b) => a - b).join(', ');
    return `<span class="name-tok">${escapeHtml(r.name)}</span>: ${sorted}`;
  }).join('\n');

  const plainText = residents.map(r => {
    const ds = r.offDates.length ? r.offDates.slice().sort((a,b)=>a-b).join(', ') : '—';
    return `${r.name}: ${ds}`;
  }).join('\n');

  return `
    <h2>Toplu özet</h2>
    <p class="muted mb-2">Tüm asistanların nöbet istemediği günler. Aşağıdaki kutuyu kopyalayabilirsiniz.</p>
    <div class="row mb-2">
      <button class="btn btn-sm" id="copyBtn">📋 Düz metin kopyala</button>
    </div>
    <div class="summary-box" id="summaryBox">${lines || '<span class="empty-tok">— asistan yok —</span>'}</div>
    <textarea id="plainSummary" style="position:absolute;left:-9999px;" readonly>${escapeHtml(plainText)}</textarea>
  `;
}

function renderAdminResidents() {
  const all = state.data.residents;
  const filledCount = all.filter(r => r.name && r.name.trim()).length;
  const rows = all.map((r, idx) => `
    <div class="slot-row">
      <span class="slot-num">${idx + 1}</span>
      <input type="text" class="slot-name" data-resid="${r.id}" value="${escapeHtml(r.name)}" placeholder="(boş slot)">
      <input type="text" class="slot-pass" data-resid="${r.id}" value="${escapeHtml(r.password)}" placeholder="şifre">
      <span class="slot-meta">${r.offDates.length > 0 ? `<b>${r.offDates.length}</b> gün${r.submitted ? ' · ✓' : ''}` : ''}</span>
      <button class="btn btn-ghost btn-sm clear-slot-btn" data-resid="${r.id}" title="Bu slotu boşalt">✕</button>
    </div>
  `).join('');

  return `
    <h2>Asistan listesi</h2>
    <p class="muted mb-2">Toplam <b>${all.length}</b> slot · <b>${filledCount}</b> dolu · <b>${all.length - filledCount}</b> boş. İsim ve şifreler değiştirildiğinde otomatik kaydedilir.</p>

    <div class="slot-list-header">
      <span></span>
      <span>İsim</span>
      <span>Şifre</span>
      <span>Veri</span>
      <span></span>
    </div>
    <div class="slot-list mb-2">${rows}</div>

    <div class="row mb-2">
      <button class="btn btn-secondary btn-sm" id="addSlotsBtn">+ 5 boş slot ekle</button>
    </div>

    <div class="divider"></div>

    <h3>Yönetici şifresini değiştir</h3>
    <div class="row">
      <div class="form-group" style="flex:1; min-width:200px; margin-bottom:0;">
        <input type="password" id="newAdminPass" placeholder="Yeni yönetici şifresi">
      </div>
      <button class="btn btn-secondary" id="changeAdminPassBtn">Değiştir</button>
    </div>
  `;
}

/* ============================================================
   EVENTS
   ============================================================ */
function bindEvents() {
  // Login
  const loginBtn = document.getElementById('loginBtn');
  if (loginBtn) {
    loginBtn.addEventListener('click', handleLogin);
    document.getElementById('loginPass').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
  }

  // Logout
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) logoutBtn.addEventListener('click', () => {
    state.currentUser = null;
    state.view = 'login';
    state.loginError = '';
    render();
  });

  // Resident calendar
  document.querySelectorAll('#calendar .day-cell[data-day]').forEach(cell => {
    cell.addEventListener('click', () => {
      const r = state.currentUser;
      if (r.submitted || !isWindowOpen()) return;
      const day = parseInt(cell.dataset.day, 10);
      const idx = r.offDates.indexOf(day);
      if (idx >= 0) r.offDates.splice(idx, 1);
      else r.offDates.push(day);
      saveData();
      render();
    });
  });

  // Range add
  const rangeAddBtn = document.getElementById('rangeAddBtn');
  if (rangeAddBtn) rangeAddBtn.addEventListener('click', () => {
    const r = state.currentUser;
    const from = parseInt(document.getElementById('rangeFrom').value, 10);
    const to = parseInt(document.getElementById('rangeTo').value, 10);
    if (isNaN(from) || isNaN(to) || from < 1 || to > 31 || from > to) {
      alert('Geçerli bir aralık girin (1-31 arası, başlangıç ≤ son).');
      return;
    }
    for (let i = from; i <= to; i++) {
      if (!r.offDates.includes(i)) r.offDates.push(i);
    }
    saveData();
    render();
  });

  // Clear own selections
  const clearOwnBtn = document.getElementById('clearOwnBtn');
  if (clearOwnBtn) clearOwnBtn.addEventListener('click', () => {
    if (!confirm('Tüm seçimlerinizi silmek istediğinize emin misiniz?')) return;
    state.currentUser.offDates = [];
    saveData();
    render();
  });

  // Submit
  const submitBtn = document.getElementById('submitBtn');
  if (submitBtn) submitBtn.addEventListener('click', () => {
    const r = state.currentUser;
    if (r.offDates.length === 0) {
      if (!confirm('Hiç gün seçmediniz. Yine de "hiç istek yok" olarak kaydedilsin mi?')) return;
    } else {
      if (!confirm(`${r.offDates.length} gün seçtiniz. Kaydedilsin mi? Sonra değiştiremezsiniz.`)) return;
    }
    r.submitted = true;
    saveData();
    render();
  });

  // Admin tabs
  document.querySelectorAll('.tab[data-tab]').forEach(t => {
    t.addEventListener('click', () => {
      state.adminTab = t.dataset.tab;
      render();
    });
  });

  // Admin: window settings
  const saveWindowBtn = document.getElementById('saveWindowBtn');
  if (saveWindowBtn) saveWindowBtn.addEventListener('click', () => {
    const s = document.getElementById('startDateInput').value;
    const c = document.getElementById('cutoffDateInput').value;
    if (!s || !c) { alert('İki tarihi de doldurun.'); return; }
    if (c < s) { alert('Cutoff tarihi başlangıçtan önce olamaz.'); return; }
    state.data.config.startDate = s;
    state.data.config.cutoffDate = c;
    saveData();
    state.flash = 'Veri giriş penceresi güncellendi.';
    render();
  });
  const quick5 = document.getElementById('quick5Btn');
  if (quick5) quick5.addEventListener('click', () => {
    const t = todayISO();
    state.data.config.startDate = t;
    state.data.config.cutoffDate = addDaysISO(t, 5);
    saveData();
    state.flash = 'Bugün + 5 gün olarak ayarlandı.';
    render();
  });
  const quick7 = document.getElementById('quick7Btn');
  if (quick7) quick7.addEventListener('click', () => {
    const t = todayISO();
    state.data.config.startDate = t;
    state.data.config.cutoffDate = addDaysISO(t, 7);
    saveData();
    state.flash = 'Bugün + 7 gün olarak ayarlandı.';
    render();
  });

  // Admin: clear all
  const clearBtn = document.getElementById('clearBtn');
  if (clearBtn) clearBtn.addEventListener('click', () => {
    if (!confirm('TÜM tercihler ve gönderim durumları silinecek. Asistan listesi ve şifreler korunur. Devam edilsin mi?')) return;
    state.data.residents.forEach(r => { r.offDates = []; r.submitted = false; });
    state.data.config.startDate = '';
    state.data.config.cutoffDate = '';
    saveData();
    state.flash = 'Veriler temizlendi. Yeni dönem için tarihleri ayarlayabilirsiniz.';
    render();
  });

  // Admin: toggle submission
  document.querySelectorAll('.submit-toggle').forEach(cb => {
    cb.addEventListener('change', () => {
      const r = state.data.residents.find(x => x.id === cb.dataset.resid);
      if (r) { r.submitted = cb.checked; saveData(); }
    });
  });

  // Admin: copy summary
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) copyBtn.addEventListener('click', () => {
    const ta = document.getElementById('plainSummary');
    ta.select();
    try {
      document.execCommand('copy');
      copyBtn.textContent = '✓ Kopyalandı';
      setTimeout(() => { copyBtn.textContent = '📋 Düz metin kopyala'; }, 1500);
    } catch (e) { alert('Kopyalanamadı.'); }
  });

  // Admin: residents management — inline editing
  document.querySelectorAll('.slot-name').forEach(inp => {
    inp.addEventListener('change', () => {
      const r = state.data.residents.find(x => x.id === inp.dataset.resid);
      if (!r) return;
      const newName = inp.value.trim();
      // duplicate check (ignore self & empty)
      if (newName && state.data.residents.some(x => x.id !== r.id && x.name.trim().toLowerCase() === newName.toLowerCase())) {
        alert('Bu isim başka bir slotta zaten var.');
        inp.value = r.name;
        return;
      }
      r.name = newName;
      saveData();
    });
  });

  document.querySelectorAll('.slot-pass').forEach(inp => {
    inp.addEventListener('change', () => {
      const r = state.data.residents.find(x => x.id === inp.dataset.resid);
      if (!r) return;
      r.password = inp.value.trim() || '1234';
      if (!inp.value.trim()) inp.value = '1234';
      saveData();
    });
  });

  document.querySelectorAll('.clear-slot-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const r = state.data.residents.find(x => x.id === btn.dataset.resid);
      if (!r) return;
      const label = r.name || '(boş slot)';
      if (!confirm(`${label} slotu boşaltılacak (isim, şifre, tarihler sıfırlanır). Devam?`)) return;
      r.name = '';
      r.password = '1234';
      r.submitted = false;
      r.offDates = [];
      saveData();
      state.flash = 'Slot boşaltıldı.';
      render();
    });
  });

  const addSlotsBtn = document.getElementById('addSlotsBtn');
  if (addSlotsBtn) addSlotsBtn.addEventListener('click', () => {
    for (let i = 0; i < 5; i++) {
      state.data.residents.push({ id: newId(), name: '', password: '1234', submitted: false, offDates: [] });
    }
    saveData();
    state.flash = '5 boş slot eklendi.';
    render();
  });

  // Admin: change admin password
  const changeAdminPassBtn = document.getElementById('changeAdminPassBtn');
  if (changeAdminPassBtn) changeAdminPassBtn.addEventListener('click', () => {
    const np = document.getElementById('newAdminPass').value.trim();
    if (!np) { alert('Şifre girin.'); return; }
    state.data.admin.password = np;
    saveData();
    state.flash = 'Yönetici şifresi güncellendi.';
    render();
  });
}

function handleLogin() {
  const userVal = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  if (!userVal) { state.loginError = 'Kullanıcı seçin.'; render(); return; }
  if (userVal === '__admin__') {
    if (pass === state.data.admin.password) {
      state.currentUser = 'admin';
      state.view = 'admin';
      state.loginError = '';
      render();
    } else {
      state.loginError = 'Yönetici şifresi yanlış.';
      render();
    }
    return;
  }
  const r = state.data.residents.find(x => x.id === userVal);
  if (r && r.password === pass) {
    state.currentUser = r;
    state.view = 'resident';
    state.loginError = '';
    render();
  } else {
    state.loginError = 'Şifre yanlış.';
    render();
  }
}

/* ============================================================
   INIT — Firebase'e bağlan, dinleyiciyi başlat
   ============================================================ */
async function start() {
  render(); // loading göster
  try {
    await signInAnonymously(fbAuth);

    let firstSnapshot = true;
    onSnapshot(DOC_REF, async (snap) => {
      if (snap.exists()) {
        const data = snap.data();
        // sanity defaults
        if (!data.config) data.config = { startDate: '', cutoffDate: '' };
        if (!data.residents) data.residents = buildDefaultResidents();
        if (!data.admin) data.admin = { password: 'admin123' };
        state.data = data;
      } else if (firstSnapshot) {
        // İlk defa açılıyor — varsayılan veriyi yaz
        state.data = structuredClone(DEFAULT_DATA);
        try {
          await setDoc(DOC_REF, state.data);
        } catch (e) {
          console.error('İlk veri yazımı başarısız:', e);
        }
      }
      state.fbStatus = 'ready';
      firstSnapshot = false;

      // Eğer kullanıcı zaten oturum açtıysa, giriş yaptığı resident referansını tazele
      if (state.currentUser && state.currentUser !== 'admin') {
        const fresh = state.data.residents.find(r => r.id === state.currentUser.id);
        if (fresh) state.currentUser = fresh;
        else { state.currentUser = null; state.view = 'login'; } // silinmiş olabilir
      }

      render();
    }, (err) => {
      console.error('Firestore okuma hatası:', err);
      state.fbStatus = 'error';
      state.fbError = err.message || String(err);
      render();
    });
  } catch (e) {
    console.error('Firebase başlatılamadı:', e);
    state.fbStatus = 'error';
    state.fbError = e.message || String(e);
    render();
  }
}

start();
</script>
